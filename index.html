<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Event – Skóre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" aria-label="Skóre týmů">
    <img class="bg" src="img/background.jpg" alt="">

    <div class="score score--red" data-team="red">
      <span class="score__label">Red team</span>
      <span class="score__value">0</span>
    </div>

    <div class="score score--blue" data-team="blue">
      <span class="score__label">Blue team</span>
      <span class="score__value">0</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
